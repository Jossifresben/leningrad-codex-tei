project:
  name: leningrad-codex-tei

paths:
  alignments: data/alignments/
  audit: data/audit/
  images: data/images/
  output: edition/
  seed: data/seed/lci_recs.json
  word_stream: data/word_stream.json
  uxlc: data/uxlc/
  provenance: data/provenance.json

images:
  base_url: "https://manuscripts.sefaria.org/leningrad-color/"
  naming: "BIB_LENCDX_F{folio}.jpg"
  source: "sefaria"

seed:
  upstream_url: "https://github.com/bdenckla/MAM-basics/"
  commit: "3d6c3a654446fdbccef1511cf827331d9fb270ec"
  file: "in/lci_recs.json"

uxlc:
  # UXLC 2.5 (build 27.6); tanach.us now serves only the current release.
  # The mirror and its README are on the uxlc-mirror branch.
  download_url: "https://raw.githubusercontent.com/charlesLoder/leningrad-codex-tei/499fdcc207174396f6d371d412eb18f72d98a508/Tanach-2.5.xml.zip"

ai:
  model: "gemini-3.8-flash"
  temperature: 1.0
  max_retries: 3
  inference: "batch"
  code_execution: true
  base_delay: 5
  timeout_ms: 600000
  fallback_to_standard: false
  image_transport: "encode"
  thinking_level: "medium"
